name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      SIGNING_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: swift test

      - name: Import Developer ID certificate
        if: env.SIGNING_CERTIFICATE != ''
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials threadhaven \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}"

      - name: Build signed and notarized app
        if: env.SIGNING_CERTIFICATE != ''
        run: make notarize SIGN_IDENTITY="${{ secrets.DEVELOPER_ID_IDENTITY }}"

      - name: Build unsigned app
        if: env.SIGNING_CERTIFICATE == ''
        run: make zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(cat VERSION)"
          scripts/changelog-section.sh "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" "build/ThreadHaven-$version.zip" \
            --title "ThreadHaven $version" --notes-file notes.md
