name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: swift test

      - name: Check signing setup
        id: signing
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
        run: echo "enabled=$([ -n "$CERTIFICATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12 -k "$keychain"
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials threadhaven --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Build signed and notarized app
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: make notarize SIGN_IDENTITY="$SIGN_IDENTITY"

      - name: Build unsigned app
        if: steps.signing.outputs.enabled != 'true'
        run: make zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(cat VERSION)"
          scripts/changelog-section.sh "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" "build/ThreadHaven-$version.zip" \
            --repo "$GITHUB_REPOSITORY" --title "ThreadHaven $version" --notes-file notes.md
